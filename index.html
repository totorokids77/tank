<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>보카랜드 수호대 - 단어 결정을 되찾아라!</title>
<style>
  * { box-sizing: border-box; font-family: 'Pretendard','Malgun Gothic',sans-serif; }
  body { background:#0b1220; color:#fff; margin:0; padding:14px; display:flex; flex-direction:column; align-items:center; }
  h1 { margin:6px 0 12px; font-size:24px; color:#f1c40f; text-shadow:2px 2px 4px #000; text-align:center; }
  .topbar { width:min(800px,100%); display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .topbar .tip { font-size:12px; color:#9fb0c3; flex:1; min-width:220px; }
  button { cursor:pointer; border:none; border-radius:8px; font-weight:bold; font-size:14px; padding:8px 14px; background:#2c3e50; color:#fff; }
  button:hover { filter:brightness(1.2); }
  .btn-primary { background:#e67e22; }
  .btn-green { background:#27ae60; }
  .game-box { position:relative; width:min(800px,100%); aspect-ratio:8/5; background:#0f172a; border:4px solid #f1c40f; border-radius:10px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.8); user-select:none; }
  #gameCanvas { width:100%; height:100%; display:block; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:8px; right:8px; display:none; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  .hud-left, .hud-right { background:rgba(0,0,0,.65); border:2px solid #f39c12; border-radius:10px; padding:6px 10px; font-weight:bold; font-size:15px; min-width:92px; text-align:center; }
  .hud-left { border-color:#e74c3c; }
  #quest { flex:1; background:rgba(0,0,0,.8); border:2px solid #00e5c0; border-radius:10px; padding:5px 12px; text-align:center; }
  #quest .lab { font-size:11px; color:#7ff; }
  #questText { font-size:16px; font-weight:bold; color:#fff; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #overlay { position:absolute; inset:0; display:none; overflow:auto; }
  #overlay.center { background:rgba(5,10,25,.88); align-items:flex-start; justify-content:center; }
  #overlay.dim { background:rgba(0,0,0,.45); align-items:flex-end; }
  .menu { width:100%; padding:10px 14px; text-align:center; }
  .menu h2 { margin:4px 0; color:#f1c40f; font-size:22px; }
  .menu p { margin:2px 0 8px; font-size:13px; color:#c8d3e0; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:8px; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 2px; background:#1f2d3d; border:2px solid #34495e; border-radius:8px; font-size:11px; }
  .stage .s-emoji { font-size:22px; }
  .stage .s-name { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .stage .s-star { color:#f1c40f; font-size:11px; letter-spacing:1px; }
  .stage.cleared { border-color:#27ae60; }
  .dlg-full { width:100%; height:100%; display:flex; align-items:flex-end; padding:12px; cursor:pointer; }
  .dialog { width:100%; background:rgba(8,14,30,.95); border:3px solid #f1c40f; border-radius:14px; padding:12px 14px; display:flex; gap:14px; align-items:center; min-height:110px; }
  .portrait { font-size:54px; width:80px; height:80px; flex:none; display:flex; align-items:center; justify-content:center; background:#1c2a45; border-radius:50%; border:3px solid #f39c12; }
  .dname { color:#f1c40f; font-weight:bold; font-size:15px; margin-bottom:4px; }
  .dtext { font-size:17px; line-height:1.45; min-height:50px; }
  .dnext { text-align:right; font-size:11px; color:#8fa3bd; }
  .panel { width:min(560px,94%); margin:16px auto; background:rgba(8,14,30,.96); border:3px solid #f1c40f; border-radius:14px; padding:14px 18px; text-align:center; }
  .panel h2 { margin:2px 0 6px; color:#f1c40f; }
  .stars { font-size:34px; color:#f1c40f; letter-spacing:4px; }
  .panel p { margin:4px 0; font-size:14px; color:#dbe6f3; }
  .review { text-align:left; background:#13203a; border-radius:8px; padding:8px 12px; margin:8px 0; max-height:130px; overflow:auto; font-size:13px; }
  .review h3 { margin:0 0 4px; font-size:14px; color:#ff9f43; }
  .review li { margin:2px 0; }
  .btns { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .study-panel { width:min(800px,100%); margin-top:14px; background:#1b2838; border-radius:10px; padding:12px 14px; }
  details summary { cursor:pointer; font-weight:bold; color:#f1c40f; }
  .study-tools { display:flex; gap:8px; align-items:center; margin:10px 0 4px; flex-wrap:wrap; }
  select { padding:7px 10px; border-radius:6px; border:none; font-size:14px; }
  .word-table { width:100%; border-collapse:collapse; margin-top:8px; }
  .word-table th, .word-table td { border:1px solid #455a64; padding:6px 10px; text-align:left; font-size:13px; }

let audioCtx = null, soundOn = true;
function ac() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, delay, slide) {
  if (!soundOn) return;
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol || 0.06, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }

  ov.innerHTML = html;
  ov.style.display = 'flex';
  ov.scrollTop = 0;

let dlg = null, typer = null;
function showDialog(lines, done) {
  G.mode = 'dialog';
  dlg = { lines, i: 0, done };

function renderDialog() {
  const L = dlg.lines[dlg.i];
  setOverlay(`<div class="dlg-full" data-act="dlg"><div class="dialog"><div class="portrait">${L.e}</div><div style="flex:1"><div class="dname">${esc(L.n)}</div><div class="dtext" id="dtext"></div><div class="dnext">▶ 클릭 / 스페이스</div></div></div></div>`, 'dim');
  const el = document.getElementById('dtext');
  clearInterval(typer);
  let k = 0;
  typer = setInterval(() => {
    k++; el.textContent = L.text.slice(0, k);
    if (k >= L.text.length) { clearInterval(typer); typer = null; }
  }, 26);
}
function advanceDialog() {
  if (!dlg) return;
  if (typer) {
    clearInterval(typer); typer = null;
    const el = document.getElementById('dtext');
    if (el) el.textContent = dlg.lines[dlg.i].text;
    return;
  }
  sfx.click();
  dlg.i++;
  if (dlg.i >= dlg.lines.length) {
    const cb = dlg.done; dlg = null;
    setOverlay('');
    if (cb) cb();
  } else renderDialog();
}

    cells += `<button class="stage ${s ? 'cleared' : ''}" data-act="stage" data-i="${i}" title="Unit ${i+1} · ${unitList(i).length}단어"><span class="s-emoji">${CH[i].boss}</span><span class="s-name">${i+1}. ${CH[i].t}</span><span class="s-star">${starStr(s)}</span></button>`;
  }
  setOverlay(`<div class="menu"><h2>🗺️ 보카랜드 지도</h2><p>망각 마왕 포겟이 훔쳐 간 단어 결정을 되찾아라! (해방 ${cleared} / 35)</p><div class="btns" style="margin:4px 0"><button data-act="story">📜 이야기 보기</button><button class="btn-primary" data-act="stage" data-i="${next}">▶ ${next+1}단계 출발!</button></div><div class="grid">${cells}</div></div>`, 'center');
}

// ===== 단계 시작 =====
function startStage(i) {
  G.session++; G.idx = i; G.paused = false;
  setStudyUnit(i);
  initPlayState();
  const c = CH[i];
  showDialog([
    { e:'📍', n:'Chapter ' + (i + 1), text:`${c.t} (Unit ${i+1}) — 단어 결정 ${unitList(i).length}개가 사라졌다!` },
    { e:c.boss, n:c.bn, text:c.bl },
    { e:'🧒', n:'토리 (조종사)', text:c.hl }
  ], beginPlay);
  hud.style.display = 'none';
}
function initPlayState() {
  const i = G.idx;
  Object.assign(G, {
    mode:'dialog', hearts:MAX_HEARTS, lost:0, score:0, combo:0, maxCombo:0, kills:0,
    need: 8 + Math.floor(i / 6), deck:[], question:null,
    monsters:[], bullets:[], items:[], parts:[], floaters:[],
    spawnT:0.2, hint:0, ready:2.4, bossHit:0, bossDead:false, wrong:new Map(), paused:false
  });
  tank.x = W / 2 - tank.w / 2;
  nextQuestion();
}
function beginPlay() {
  initPlayState();
  G.mode = 'play';
  hud.style.display = 'flex';
  setOverlay('');
  updateHud();
  canvas.focus();
}
function nextQuestion() {
  if (!G.deck.length) G.deck = shuffle(unitList(G.idx).slice());
  G.question = G.deck.pop();
  const el = document.getElementById('questText');
  el.textContent = G.question.m;
  el.title = G.question.m;
}
function updateHud() {
  document.getElementById('hudHearts').textContent = '❤️'.repeat(G.hearts) + '🖤'.repeat(MAX_HEARTS - G.hearts);
  document.getElementById('hudScore').textContent = '⭐ ' + G.score;
  document.getElementById('hudCombo').innerHTML = G.combo >= 2 ? '🔥 콤보 ' + G.combo : '&nbsp;';
}

// ===== 입력 =====
function fire() {
  if (G.mode !== 'play' || G.paused || G.ready > 0) return;
  if (G.t - G.lastShot < 0.16) return;
  G.lastShot = G.t; G.flash = 0.08;
  G.bullets.push({ x: tank.x + tank.w / 2, y: tank.y - 24, r: 5, v: 9 });
  sfx.shoot();
}
function togglePause() {
  if (G.mode !== 'play') return;
  G.paused = !G.paused; keys = {};
  if (G.paused) setOverlay(`<div class="panel"><h2>⏸️ 일시정지</h2><div class="btns"><button class="btn-primary" data-act="resume">▶ 계속하기</button><button data-act="map">🗺️ 지도로</button></div></div>`, 'center');
  else setOverlay('');
}
window.addEventListener('keydown', e => {
  if (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
  if (G.mode === 'dialog') { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) advanceDialog(); return; }
  if (e.code === 'Escape') { togglePause(); return; }
  keys[e.code] = true;
  if (e.code === 'Space' && !e.repeat) fire();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { keys = {}; });

canvas.tabIndex = 0; canvas.style.outline = 'none';
function pointerX(clientX) {
  const r = canvas.getBoundingClientRect();
  const x = (clientX - r.left) * (W / r.width) - tank.w / 2;
  tank.x = Math.max(0, Math.min(W - tank.w, x));
}
canvas.addEventListener('mousedown', () => { canvas.focus(); ac(); fire(); });
canvas.addEventListener('mousemove', e => { if (G.mode === 'play' && !G.paused) pointerX(e.clientX); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); ac(); pointerX(e.touches[0].clientX); fire(); }, { passive:false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); pointerX(e.touches[0].clientX); }, { passive:false });

ov.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  ac();
  const act = b.dataset.act;
  if (act === 'dlg') advanceDialog();
  else if (act === 'stage') { sfx.click(); startStage(+b.dataset.i); }
  else if (act === 'story') { sfx.click(); showDialog(PROLOGUE, showMenu); }
  else if (act === 'map') { sfx.click(); showMenu(); }
  else if (act === 'resume') togglePause();
  else if (act === 'retry') { sfx.click(); beginPlay(); }
  else if (act === 'next') { sfx.click(); startStage(G.idx + 1); }
});
document.getElementById('btnMap').onclick = () => { sfx.click(); showMenu(); };
document.getElementById('btnSound').onclick = e => {
  soundOn = !soundOn; e.target.textContent = soundOn ? '🔊 소리 켬' : '🔇 소리 끔'; if (soundOn) sfx.click();
};

// ===== 게임 로직 =====
function spawnMonster() {
  const list = unitList(G.idx);
  if (Math.random() < 0.08) {
    const heart = G.hearts < MAX_HEARTS && Math.random() < 0.5;
    G.items.push({ x: 30 + Math.random() * (W - 90), y: -40, w: 40, h: 40, kind: heart ? 'heart' : 'hint', v: 1.4 });
  }
  const needCorrect = !G.monsters.some(m => m.word.w === G.question.w);
  let word;
  if (needCorrect || Math.random() < 0.3) word = G.question;
  else {
    let tries = 0;
    do { word = list[rnd(list.length)]; tries++; }
    while ((word.w === G.question.w || G.monsters.some(m => m.word.w === word.w)) && tries < 10);
  }
  ctx.font = `bold 15px ${FONT}`;
  const w = Math.max(84, Math.min(300, Math.ceil(ctx.measureText(word.w).width) + 24));
  const amp = Math.min(30, 4 + G.idx);
  const bx = amp + 6 + Math.random() * (W - w - 2 * (amp + 6));
  G.monsters.push({
    word, w, h: 64, bx, x: bx, y: -70, ph: Math.random() * 6.28, amp,
    v: 0.85 + G.idx * 0.02 + Math.random() * 0.7
  });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 1 + Math.random() * 4;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 0.6 + Math.random() * 0.4, max: 1, c: color, s: 2 + Math.random() * 3 });
  }
}
function floater(x, y, text, color) { G.floaters.push({ x, y, text, c: color, life: 1 }); }
function noteWrong(w) { G.wrong.set(w.w, w); }

function update(dt) {
  const f = dt * 60;
  G.t += dt;
  bgStars.forEach(s => { s.y += s.v * f; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
  if (G.flash > 0) G.flash -= dt;
  if (G.bossHit > 0) G.bossHit -= dt;
  if (G.mode === 'menu' || !G.parts) return;
  if (G.paused) return;

  G.parts.forEach(p => { p.x += p.vx * f; p.y += p.vy * f; p.vy += 0.15 * f; p.life -= dt; });
  G.parts = G.parts.filter(p => p.life > 0);
  G.floaters.forEach(p => { p.y -= 0.8 * f; p.life -= dt * 0.9; });
  G.floaters = G.floaters.filter(p => p.life > 0);

  if (G.mode !== 'play') return;

  if ((keys['ArrowLeft'] || keys['KeyA']) && tank.x > 0) tank.x -= tank.speed * f;
  if ((keys['ArrowRight'] || keys['KeyD']) && tank.x < W - tank.w) tank.x += tank.speed * f;
  tank.x = Math.max(0, Math.min(W - tank.w, tank.x));

  if (G.ready > 0) { G.ready -= dt; return; }
  if (G.hint > 0) G.hint -= dt;

  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    spawnMonster();
    G.spawnT = Math.max(0.8, 1.5 - G.idx * 0.015) * (0.7 + Math.random() * 0.6);
  }

  for (let i = G.bullets.length - 1; i >= 0; i--) {
    G.bullets[i].y -= G.bullets[i].v * f;
    if (G.bullets[i].y < -20) G.bullets.splice(i, 1);
  }
  G.items.forEach(it => { it.y += it.v * f; });
  G.monsters.forEach(m => { m.y += m.v * f; m.x = Math.max(2, Math.min(W - m.w - 2, m.bx + Math.sin(G.t * 1.6 + m.ph) * m.amp)); });

  // 총알 vs 아이템
  for (let bi = G.bullets.length - 1; bi >= 0; bi--) {
    const b = G.bullets[bi];
    let used = false;
    for (let ii = G.items.length - 1; ii >= 0; ii--) {
      const it = G.items[ii];
      if (b.x > it.x && b.x < it.x + it.w && b.y > it.y && b.y < it.y + it.h) {
        if (it.kind === 'heart') { G.hearts = Math.min(MAX_HEARTS, G.hearts + 1); floater(it.x, it.y, '❤️ +1', '#ff7675'); }
        else { G.hint = 6; floater(it.x, it.y, '💡 정답이 반짝!', '#f9ca24'); }
        burst(it.x + 20, it.y + 20, '#f9ca24', 14); sfx.item();
        G.items.splice(ii, 1); G.bullets.splice(bi, 1); used = true; updateHud();
        break;
      }
    }
    if (used) continue;
    // 총알 vs 몬스터
    for (let mi = G.monsters.length - 1; mi >= 0; mi--) {
      const m = G.monsters[mi];
      if (b.x > m.x && b.x < m.x + m.w && b.y > m.y && b.y < m.y + m.h) {
        G.bullets.splice(bi, 1);
        G.monsters.splice(mi, 1);
        hitMonster(m);
        break;
      }
    }
    if (G.mode !== 'play') return;
  }

  // 바닥 도달
  for (let mi = G.monsters.length - 1; mi >= 0; mi--) {
    const m = G.monsters[mi];
    if (m.y > H - 20) {
      G.monsters.splice(mi, 1);
      if (m.word.w === G.question.w) {
        G.hearts--; G.lost++; G.combo = 0; G.shake = 10;
        noteWrong(G.question);
        floater(m.x + m.w / 2, H - 70, '💔 놓쳤다!', '#ff7675');
        sfx.hurt(); updateHud();
        if (G.hearts <= 0) { gameOver(); return; }
      }
    }
  }
  for (let ii = G.items.length - 1; ii >= 0; ii--) if (G.items[ii].y > H) G.items.splice(ii, 1);
}

function hitMonster(m) {
  const cx = m.x + m.w / 2, cy = m.y + 30;
  if (m.word.w === G.question.w) {
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
    const mult = Math.min(5, 1 + Math.floor(G.combo / 3));
    const pts = 10 * mult;
    G.score += pts; G.kills++; G.bossHit = 0.35;
    burst(cx, cy, '#f1c40f', 22);
    floater(cx, cy, '+' + pts + (mult > 1 ? ' x' + mult : ''), '#f1c40f');
    sfx.good();
    G.monsters = G.monsters.filter(o => o.word.w !== G.question.w || false);
    if (G.kills >= G.need) { updateHud(); win(); return; }
    nextQuestion();
    G.spawnT = Math.min(G.spawnT, 0.4);
  } else {
    G.combo = 0; G.score = Math.max(0, G.score - 5); G.shake = 5;
    noteWrong(G.question);
    burst(cx, cy, '#e74c3c', 14);
    floater(cx, cy, '✗ 오답! -5', '#ff7675');
    sfx.bad();
  }
  updateHud();
}

function win() {
  G.mode = 'clear'; G.bossDead = true; G.shake = 12;
  G.monsters = []; G.bullets = []; G.items = [];
  burst(W / 2, 100, '#f1c40f', 60); burst(W / 2, 100, '#ff7675', 40);
  sfx.win();
  const st = G.lost === 0 ? 3 : (G.lost <= 2 ? 2 : 1);
  starsSaved[G.idx] = Math.max(starsSaved[G.idx] || 0, st);
  saveJSON('vocabTankStars', starsSaved);
  const ses = G.session, c = CH[G.idx];
  setTimeout(() => {
    if (ses !== G.session) return;
    const lines = [
      { e:c.boss, n:c.bn, text:c.ol },
      { e:'🧒', n:'토리 (조종사)', text:`${c.t}의 단어 결정을 되찾았다! 다음 지역으로 출발!` }
    ];
    if (G.idx === 34) lines.push(...EPILOGUE);
    showDialog(lines, () => showResult(true, st));
  }, 1400);
}
function gameOver() {
  G.mode = 'over'; sfx.lose();
  const ses = G.session, c = CH[G.idx];
  setTimeout(() => {
    if (ses !== G.session) return;
    setOverlay(`<div class="panel"><h2>💥 탱크가 쓰러졌다...</h2><p>${c.boss} ${esc(c.bn)}: "하하하! 단어는 영원히 내 거다!"</p><p>점수 ${G.score} · 보스 체력 ${G.need - G.kills}/${G.need} 남음</p>${reviewHtml()}<div class="btns"><button class="btn-primary" data-act="retry">🔁 다시 도전</button><button data-act="map">🗺️ 지도로</button></div></div>`, 'center');
  }, 700);
}
function reviewHtml() {
  if (!G.wrong.size) return '<p>👑 실수 없이 클리어! 단어 마스터!</p>';
  let li = '';
  G.wrong.forEach(w => { li += `<li><strong>${esc(w.w)}</strong> — ${esc(w.m)}</li>`; });
  return `<div class="review"><h3>📝 복습 노트 (헷갈린 단어)</h3><ul style="margin:0;padding-left:18px">${li}</ul></div>`;
}
function showResult(ok, st) {
  const c = CH[G.idx];
  const last = G.idx === 34;
  setOverlay(`<div class="panel"><h2>🎉 ${esc(c.t)} 해방!</h2><div class="stars">${starStr(st)}</div><p>점수 ${G.score} · 최고 콤보 ${G.maxCombo} · 남은 하트 ${G.hearts}/${MAX_HEARTS}</p>${reviewHtml()}<div class="btns">${last ? '' : '<button class="btn-primary" data-act="next">다음 지역 ▶</button>'}<button data-act="retry">🔁 다시 하기</button><button data-act="map">🗺️ 지도로</button></div></div>`, 'center');
}

// ===== 그리기 =====
function drawBoss() {
  if (G.bossDead) return;
  const c = CH[G.idx];
  const hurt = G.bossHit > 0;
  const bx = W / 2 + (hurt ? (Math.random() - 0.5) * 10 : 0);
  const by = 104 + Math.sin(G.t * 2) * 6;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `62px ${FONT}`;
  if (hurt) ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.t * 60);
  ctx.fillText(c.boss, bx, by);
  ctx.restore();
  // 체력바
  const ratio = Math.max(0, (G.need - G.kills) / G.need);
  ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(W / 2 - 112, 140, 224, 14, 7); ctx.fill();
  ctx.fillStyle = ratio > 0.5 ? '#e74c3c' : (ratio > 0.25 ? '#e67e22' : '#f1c40f');
  if (ratio > 0) { rr(W / 2 - 110, 142, 220 * ratio, 10, 5); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.font = `bold 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${c.bn}  ${G.need - G.kills}/${G.need}`, W / 2, 166);
}
function drawTank() {
  const x = tank.x, y = tank.y;
  ctx.fillStyle = '#16231d'; rr(x - 3, y + 14, tank.w + 6, 16, 8); ctx.fill();
  ctx.fillStyle = '#4b5d52';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(x + 6 + i * 11, y + 22, 4.5, 0, 6.28); ctx.fill(); }
  ctx.fillStyle = '#2ecc71'; rr(x + 3, y + 2, tank.w - 6, 18, 6); ctx.fill();
  ctx.fillStyle = '#27ae60'; rr(x + tank.w / 2 - 13, y - 8, 26, 16, 6); ctx.fill();
  ctx.fillStyle = '#1e8449'; ctx.fillRect(x + tank.w / 2 - 3, y - 26, 6, 20);
  ctx.font = `14px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🧒', x + tank.w / 2, y + 1);
  if (G.flash > 0) {
    ctx.fillStyle = '#f9e79f'; ctx.beginPath(); ctx.arc(x + tank.w / 2, y - 28, 9, 0, 6.28); ctx.fill();
  }
}
function drawMonster(m) {
  const c = CH[G.idx], cx = m.x + m.w / 2;
  const isAns = m.word.w === G.question.w;
  const glow = G.hint > 0 && isAns;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `36px ${FONT}`;
  ctx.fillText(c.mob, cx, m.y + 18 + Math.sin(G.t * 4 + m.ph) * 3);
  if (glow) { ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 18 + 8 * Math.sin(G.t * 10); }
  ctx.fillStyle = '#243447'; rr(m.x, m.y + 38, m.w, 26, 9); ctx.fill();
  ctx.lineWidth = glow ? 3 : 2; ctx.strokeStyle = glow ? '#f1c40f' : '#6c7f93'; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; ctx.font = `bold 15px ${FONT}`;
  ctx.fillText(m.word.w, cx, m.y + 52);
  if (glow) { ctx.font = `18px ${FONT}`; ctx.fillText('🎯', cx, m.y - 8); }
  ctx.restore();
}
function draw() {
  const hue = (G.idx * 37) % 360;
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},55%,9%)`); g.addColorStop(1, `hsl(${(hue + 40) % 360},45%,22%)`);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#fff';
  bgStars.forEach(s => { ctx.globalAlpha = 0.3 + s.s / 3; ctx.fillRect(s.x, s.y, s.s, s.s); });
  ctx.globalAlpha = 1;
  ctx.fillStyle = `hsl(${hue},35%,12%)`; ctx.fillRect(-20, 472, W + 40, 40);
  ctx.fillStyle = `hsl(${hue},50%,35%)`; ctx.fillRect(-20, 472, W + 40, 3);

  if (G.mode !== 'menu' && G.monsters) {
    drawBoss();
    G.monsters.forEach(drawMonster);
    G.items.forEach(it => {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(it.x + 20, it.y + 20, 22, 0, 6.28); ctx.fill();
      ctx.font = `28px ${FONT}`; ctx.fillStyle = '#fff';
      ctx.fillText(it.kind === 'heart' ? '❤️' : '💡', it.x + 20, it.y + 21);
    });
    G.bullets.forEach(b => {
      ctx.shadowColor = '#f9e79f'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#f9e79f'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
      ctx.shadowBlur = 0;
    });
    if (G.mode === 'play' || G.mode === 'clear' || G.mode === 'over' || G.mode === 'dialog') drawTank();
    G.parts.forEach(p => {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.6)); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    G.floaters.forEach(p => {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c; ctx.font = `bold 20px ${FONT}`;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    if (G.mode === 'play' && G.ready > 0) {
      const txt = G.ready > 1.6 ? '준비!' : (G.ready > 0.8 ? '조준!' : '발사!');
      ctx.font = `bold 56px ${FONT}`; ctx.fillStyle = '#f1c40f'; ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
      ctx.strokeText(txt, W / 2, 280); ctx.fillText(txt, W / 2, 280);
    }
  }
  ctx.restore();
}

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}

// ===== 단어 공부 / CSV =====
function setStudyUnit(i) {
  document.getElementById('studySelect').value = String(i);
  renderWordTable(i);
}
function renderWordTable(i) {
  const body = document.getElementById('wordListBody');
  body.innerHTML = '';
  unitList(i).forEach((it, n) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${n + 1}</td><td><strong>${esc(it.w)}</strong></td><td>${esc(it.m)}</td>`;
    body.appendChild(tr);
  });
}
function downloadCSV() {
  const i = +document.getElementById('studySelect').value;
  let csv = '﻿단어(Word),뜻(Meaning)\n';
  unitList(i).forEach(r => { csv += `"${r.w.replace(/"/g, '""')}","${r.m.replace(/"/g, '""')}"\n`; });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  link.download = `Unit_${i + 1}_단어장.csv`;
  link.click();
}

window.addEventListener('load', () => {
  const sel = document.getElementById('studySelect');
  for (let i = 0; i < 35; i++) {
    const o = document.createElement('option');
    o.value = String(i); o.textContent = `Unit ${i + 1} · ${CH[i].t} (${unitList(i).length}단어)`;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => { renderWordTable(+sel.value); sel.blur(); });
  document.getElementById('btnCsv').onclick = downloadCSV;
  renderWordTable(0);
  requestAnimationFrame(loop);
  if (!loadJSON('vocabTankSeen', false)) {
    saveJSON('vocabTankSeen', true);
    showDialog(PROLOGUE, showMenu);
  } else showMenu();
});
</script>
</body>
</html>
